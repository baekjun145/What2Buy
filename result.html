<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 결과 | What2Buy</title>
  <meta name="description" content="연령·성별·상황에 맞는 인기 선물 키워드 3가지를 네이버 쇼핑 데이터로 추천해드립니다." />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P8KLSV799F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P8KLSV799F');
  </script>

  <!-- 파비콘 : 브랜드 마크 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Pretendard 폰트 CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <!-- Font Awesome 아이콘 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========================= 상단 고정 내비게이션 ========================= -->
  <header class="navbar scrolled" id="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="40" cy="40.5" r="13.5" fill="none" stroke="currentColor" stroke-width="4" />
          <circle cx="25" cy="25.5" r="13.5" fill="currentColor" />
        </svg>
        <span>What2Buy</span>
      </a>

      <nav class="nav-links">
        <a href="recommend.html"><i class="fa-solid fa-arrow-left"></i> 다시 선택하기</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- ========================= 추천 결과 (3장 카드 뒤집기) ========================= -->
    <section id="resultSection" class="result-section result-page-section">
      <div class="container">
        <p class="section-label">RESULT</p>
        <h1 class="section-title">추천 선물 3가지</h1>
        <p id="resultKeywordLine" class="result-keyword-line"></p>

        <div id="resultLoading" class="result-loading" hidden>
          <div class="spinner"></div>
          <p>쇼핑 데이터로 인기 선물을 찾고 있어요…</p>
        </div>

        <div id="resultError" class="result-error" hidden>
          <p></p>
        </div>

        <div id="cardGrid" class="card-grid"></div>

        <!-- 만족도 조사 : 추천이 실제로 나온 뒤에만 보인다 (result.js가 hidden 해제) -->
        <div id="ratingBox" class="rating-box" hidden>
          <p class="rating-label">RATE THIS</p>
          <p class="rating-title">이번 추천, 만족하셨나요?</p>

          <div class="rating-stars" id="ratingStars" role="radiogroup" aria-label="추천 만족도">
            <button type="button" class="rating-star" data-score="1" role="radio" aria-checked="false" aria-label="1점">★</button>
            <button type="button" class="rating-star" data-score="2" role="radio" aria-checked="false" aria-label="2점">★</button>
            <button type="button" class="rating-star" data-score="3" role="radio" aria-checked="false" aria-label="3점">★</button>
            <button type="button" class="rating-star" data-score="4" role="radio" aria-checked="false" aria-label="4점">★</button>
            <button type="button" class="rating-star" data-score="5" role="radio" aria-checked="false" aria-label="5점">★</button>
          </div>

          <p class="rating-help" id="ratingHelp">별을 눌러 5점 만점으로 평가해 주세요</p>
          <p class="rating-note">추천 품질을 개선하는 데만 씁니다. 다시 눌러 점수를 바꿀 수 있어요.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ========================= 푸터 ========================= -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 What2Buy. All rights reserved.</p>
    </div>
  </footer>

  <!-- 스크립트 연결 -->
  <script src="result.js"></script>
</body>
</html>
